wyattjoh/caldav-mcp:
  - number: 10
    owner: "ilyasturki"
    status: open
    head: fix/emit-vtimezone-component
    base: main
    title: "fix(ical): emit VTIMEZONE for zoned events and render UTC as Zulu"
    description: |-
      ## What

      `buildVEvent` references `TZID=<zone>` in `DTSTART`/`DTEND` but never emits the matching `VTIMEZONE`, so the calendar object is incomplete per RFC 5545. This generates the `VTIMEZONE` for zoned events (the way Google and Outlook invites do), emits UTC as a plain Zulu time, and keeps the current output for zones it cannot resolve.

      ## Why

      Fixes #9. With the event stored on a server that rewrites the bare `TZID` into the RFC global form (`/Europe/Paris`, `/UTC`), DAVx5/ical4j calls `ZoneId.of("/UTC")`, throws `Invalid ID for region based ZoneId`, and stops syncing the whole collection. Native Google/Outlook invites on the same calendar are unaffected because they embed a `VTIMEZONE`. I hit this in production on Purelymail synced to DAVx5 on Android.

      ## Changes

      - **VTIMEZONE generation**: `buildVTimezone` derives offsets from `Intl` (no tz-database dependency), probes a ~400 day window around the event to find the DST transitions, and emits `STANDARD`/`DAYLIGHT` observances before the `VEVENT`. Fixed-offset zones get a single `STANDARD` observance.
      - **UTC as Zulu**: `UTC`, `Etc/UTC`, `Zulu` and `Universal` are emitted as `...Z` with no `TZID`. A bare `TZID=UTC` is exactly what gets rewritten to the invalid `/UTC`, so dropping the `TZID` avoids it entirely.
      - **Fallback guard**: zones `Intl` cannot resolve (e.g. Windows names like `W. Europe Standard Time`, which already ship their own `VTIMEZONE`) fall back to the previous bare-`TZID` output, so nothing regresses.
      - No new dependencies.

      ## Tests

      105 pass, 0 fail (was 100). Added coverage for: `Europe/Paris` summer emits a `VTIMEZONE` with a `DAYLIGHT` observance, `UTC` collapses to a Zulu time with no `TZID`, non-DST `Asia/Tokyo` emits a single `STANDARD` observance, an unresolvable Windows zone falls back to a bare `TZID`, and `parseVEvent` still round-trips a built event. `bun run check` (oxlint + oxfmt + tsc) is clean.
