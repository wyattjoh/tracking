  - number: 101961
    owner: jimmyhmiller
    status: draft
    head: jimmym/turbopack-emit-file-minify
    base: jimmym/turbopack-emit-file-source-maps
    title: "Turbopack: minify loader-emitted JavaScript and CSS in production"
    labels: [ Documentation, tests, Turbopack ]
    description: |-
      ## Summary

      Loader-emitted `.js` and `.css` files are now minified in production, using the destination compiler's minify setting, and their source maps are composed through minification. `assetInfo.minimized` skips minification for JavaScript but not CSS, which matches Next.js with webpack. A file that cannot be minified fails the build.

      CSS minification goes through a new `turbopack-css/src/minify.rs` helper built on lightningcss.

      Stacked on #101960 (emitted source maps), which is stacked on #101967.

      ## Verification

      - `test/e2e/app-dir/webpack-loader-emit-file`: `pnpm test-start-turbo`, `test-dev-turbo`, `test-start-webpack`, `test-dev-webpack`
      - `test/e2e/app-dir/webpack-loader-emit-file-conflicts`: `pnpm test-start-turbo`, `test-dev-turbo`, `test-start-webpack`
      - `test/e2e/app-dir/postcss-asset-messages` and `test/e2e/app-dir/webpack-loader-emitted-server-files`: `pnpm test-start-turbo`
      - `cargo test -p turbopack-css minify`

