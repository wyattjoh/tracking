# Demo project for the README recording (demo/tracking-tui.tape).

vercel/next.js:
  - number: 101967
    owner: jimmyhmiller
    notes: emitFile support; the rest of the stack builds on it.
    status: draft
    head: jimmym/turbopack-emit-file-core
    base: canary
    title: "Turbopack: support webpack loader emitFile"
    labels: [ Documentation, tests, Turbopack ]
    description: |-
      ## Summary

      Replaces #100858, which bundled this with the follow-ups in the stack below.

      Adds support for webpack's [`this.emitFile()`](https://webpack.js.org/api/loaders/#thisemitfile) loader API in Turbopack. Files emitted through PostCSS `asset` messages are handled the same way. Before this, `emitFile` was listed as unsupported, so loaders that emit assets (for example `file-loader` and loaders that write declaration files or templates) silently lost their output.

      - Emitted files are written relative to the output directory of the compiler that ran the loader (browser, Node.js server, or edge), matching webpack's `output.path` for each compiler.
      - Files emitted by server loaders are added to the `.nft.json` traces of the routes whose modules emitted them, so they are deployed and work with `output: 'standalone'`.
      - Supports string and `Buffer` contents.
      - Emitting different content to the same path is an error, including across routes and across the browser and server compilers. File names that leave the output directory or name a directory are errors.
      - The immutable static hashes manifest now only lists assets under `static/immutable/`. Emitted files are the first Turbopack client outputs outside that directory, and they are not content-hashed.

      ### How

      - The JS loader runner records `emitFile` calls and returns them with the loader result. On the Rust side they become `EmittedFile` collectibles (`turbopack-core/src/emitted_output.rs`), so they survive later wrapping, splitting, or tree shaking of the module that emitted them.
      - `next-api` reads those collectibles from the output asset operations, places each file in its compiler's output directory, and adds the files to the emitted output and to server traces.
      - When nested loader chains emit the same file name, the outermost chain's file wins, like webpack's compilation assets.

      ### Notes for reviewers

      - Unlike webpack, Turbopack does not build dependencies skipped as side-effect-free just to collect their emitted files. This is intentional and documented. Files from loaders that did run are kept even if their generated code is tree-shaken away.
      - Server traces skip graph edges marked unused (`include_unused: false`), following webpack, which only traces emitted files from modules that end up in a chunk.
      - Collecting emissions adds a traversal of each endpoint's modules for tracing. I haven't measured the cost on a large app yet.

      ### Stack

      This PR is the base of a stack. The follow-ups are independent features on top of it:

      1. **This PR**: emitFile and PostCSS asset messages
      2. #101957: define `__webpack_public_path__` for loaders (`file-loader` default `publicPath`)
      3. #101958: load `.mjs` webpack loaders as ES modules
      4. #101959: report emitted file conflicts across routes in development
      5. #101960: source maps for emitted JavaScript and CSS
      6. #101961: minify emitted JavaScript and CSS in production

      ## Verification

      - `test/e2e/app-dir/webpack-loader-emit-file`: `pnpm test-start-turbo`, `test-dev-turbo`, `test-start-webpack`, `test-dev-webpack`
      - `test/e2e/app-dir/webpack-loader-emit-file-conflicts`: all four modes. One test is skipped in Turbopack dev until the cross-route check in #101959 lands.
      - `test/e2e/app-dir/postcss-asset-messages`: `pnpm test-start-turbo`
      - `test/e2e/app-dir/webpack-loader-emitted-server-files`: `pnpm test-start-turbo`, `test-start-webpack`
      - `test/unit/webpack-loader-emit-file`

      <!-- NEXT_JS_LLM -->
  - number: 101957
    owner: jimmyhmiller
    status: draft
    head: jimmym/turbopack-emit-file-public-path
    base: jimmym/turbopack-emit-file-core
    title: "Turbopack: define __webpack_public_path__ for loaders"
    labels: [ Documentation, tests, "type: next" ]
    description: |-
      ## Summary

      Defines `__webpack_public_path__` in Turbopack builds as the configured asset prefix followed by `/_next/`, the same value webpack uses. Loaders such as `file-loader` build asset URLs from `__webpack_public_path__` by default, so without this their emitted URLs are wrong.

      This is only the read-only define that loaders need. Making `__webpack_public_path__` assignable at runtime is handled separately in #101054. If that lands first, this PR can be dropped or reduced to the test.

      Stacked on #101967 (emitFile support).

      ## Verification

      - `test/e2e/app-dir/webpack-loader-emit-file` (`runs file-loader with its default publicPath`): `pnpm test-start-turbo`, `test-dev-turbo`, `test-start-webpack`
      - `test/unit/webpack-loader-emit-file/public-path.test.ts`

