  - number: 101958
    owner: jimmyhmiller
    status: draft
    head: jimmym/turbopack-esm-loaders
    base: jimmym/turbopack-emit-file-public-path
    title: "Turbopack: load .mjs webpack loaders as ES modules"
    labels: [ tests, Turbopack ]
    description: |-
      ## Summary

      Webpack loaders that resolve to an `.mjs` file are now loaded as ES modules. Turbopack tells `loader-runner` to `import()` them instead of `require()`-ing them, as webpack does. ESM-only loaders such as `auto-import-x-loader` run under Turbopack as a result.

      Stacked on #101967. The test uses `auto-import-x-loader`, which writes its declaration file with `emitFile`.

      ## Verification

      - `test/e2e/app-dir/webpack-loader-emit-file` (`preserves outputs of published ESM loaders from retained modules`): `pnpm test-start-turbo`, `test-dev-turbo`

      <!-- NEXT_JS_LLM -->
  - number: 101959
    owner: jimmyhmiller
    status: draft
    head: jimmym/turbopack-emit-file-dev-conflicts
    base: jimmym/turbopack-esm-loaders
    title: "Turbopack: report emitted file conflicts across routes in development"
    labels: [ tests, Turbopack ]
    description: |-
      ## Summary

      In development, Turbopack emits each route's assets separately, so two routes that emit different content to the same loader-emitted path were not reported. When an emitted file shares a path with assets from other routes, `VersionedContentMap` now compares them and reports the same conflict that production builds report. `check_duplicates` moves out of `emit_assets` so both places can use it.

      Stacked on #101967. This removes the Turbopack dev skip on the cross-route conflict test.

      The cost is a comparison per emitted file that shares a path with another route's output. I haven't measured it on a large app.

      ## Verification

      - `test/e2e/app-dir/webpack-loader-emit-file-conflicts`: `pnpm test-dev-turbo`, `test-start-turbo`

      <!-- NEXT_JS_LLM -->
  - number: 101960
    owner: jimmyhmiller
    status: draft
    head: jimmym/turbopack-emit-file-source-maps
    base: jimmym/turbopack-emit-file-dev-conflicts
    title: "Turbopack: source maps for loader-emitted JavaScript and CSS"
    labels: [ Documentation, tests, Turbopack ]
    description: |-
      ## Summary

      Emitted JavaScript and CSS files now get the source map passed to `this.emitFile(name, content, sourceMap)` or to a PostCSS `asset` message. The map is written next to the file with a `sourceMappingURL` comment.

      - The map can be a source map object or an original source filename, as in webpack. Indexed maps are flattened.
      - Sources are resolved relative to the project, including `sourceRoot` and absolute or `file://` paths. Source contents are never read from disk, because these maps can be public.
      - The destination decides whether a map is written: public assets use the browser source map setting, and server assets use the server setting.
      - Invalid maps are dropped with a warning.
      - Identical files emitted at the same path with different maps are not a conflict, and the first map wins.

      Sources are resolved by a new helper in `emitted_output.rs` rather than `resolve_source_map_sources`. The existing helper reads `sourcesContent` from disk and resolves sources from a different base.

      Stacked on #101967.

      ## Verification

      - `test/e2e/app-dir/webpack-loader-emit-file`: `pnpm test-start-turbo`, `test-dev-turbo`, `test-start-webpack`, `test-dev-webpack`
      - `test/e2e/app-dir/webpack-loader-emit-file-source-maps`: `pnpm test-start-turbo`, `test-dev-turbo`
      - `test/e2e/app-dir/webpack-loader-emit-file-conflicts` and `test/e2e/app-dir/postcss-asset-messages`: `pnpm test-start-turbo`
      - `cargo test -p turbopack-core emitted_output`

