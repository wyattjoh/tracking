      The likely cause of the keyed regressions is the interaction with #101489's flat `EdgeSet`s. That's inferred from the code; I haven't profiled it on this base:
      - canary only pushes an owner-side reverse edge after a lock-protected forward-edge check;
      - this protocol must make sure the owner has the dependent even when the reader's edge was already current, so it checks membership on the owner;
      - on a hot owner with a large flat set, that inflates the set to a hash table.

      The remaining `change_all` gap would fit the same picture: #101736 removed per-key scans in invalidation, which helps both, but not the owner-side membership work this protocol adds on re-execution. That's a hypothesis, not measured.

      ## What changes

      Cell reads and keyed provisional refinement no longer lock the reader and the owner at the same time:

      1. **Reader section:** mark the forward dependency current. This is skipped for a known-immutable owner (bitmap from #101809).
      2. **Owner section:** add the reverse dependent if it's missing, and read/observe the cell in the same section.
      3. **Rules:**
         - Every owner step makes sure the dependent is there, even if the reader step said the edge was already current.
         - A reader mark is rolled back only for an immutable or deleted owner.
         - Failed, missing, in-progress and recompute paths keep their mutable edges (a conservative superset).
         - Removing edges stays owner-first.

      Keyed refinement:
      1. The reader marks the hash keys (skipped for a known-immutable owner).
      2. The owner adds the hash reverse edges and, only if content is present, then removes the provisional dependent.
      3. The reader removes the provisional dependency.

      When refinement is refused, the provisional edge is kept and the hash edges stay as a superset.

      This replaces #101809's cell-read and refinement uses of the bitmap in the same functions; the bitmap now skips step 1.

      **Unchanged:**
      - Output reads keep #101809's shared helper: a bitmap hit locks the owner alone, a miss takes `try_task_pair`.
      - Strong output reads, collectible reads and completion-time conversion still lock both tasks together.
      - GC, eviction, cleanup and root disposal are unchanged.

      **Interaction with canary changes:**
      - **#101732:** this PR replaces its hash-key loop in `refine_provisional_cell_dependency`. The cloneable, distinct-key `IntoIterator` API is kept, and its `keyed_dependencies` tests pass unchanged.
      - **#101733:** its premise changes, since owner registration is no longer push-only.
      - **#101736:** its early exit in `invalidate_cell_dependents` still applies. Reader-first marks the reader's forward edge before the owner registers the dependent, which is what that check reads.
      - **#101748:** collectible propagation and reads stay pair-locked here, so its staging is unaffected.

