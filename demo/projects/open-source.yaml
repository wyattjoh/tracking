  - number: 24
    owner: "vivgui"
    notes: Needs an OMP session to test.
    status: open
    review: review_required
    head: feat/omp-support
    base: main
    title: "feat: support OMP sessions"
    description: |-
      ## Summary

      OMP reports its session to herdr through `herdr integration install omp`, with the same `agent_session_path` field Pi uses, and writes Pi's JSONL format. The renamer skipped it because `omp` wasn't a known agent.

      ```diff
       resolve_path_with_home(agent, session_id)
      -  if agent == "pi"                         -> use reported path
      +  if agent == "pi" or (agent == "omp" and session_id is absolute)
      +                                           -> use reported path
      +  "omp" (id only) -> $PI_CODING_AGENT_DIR or ~/.omp/agent/sessions/*/*_<id>.jsonl

       first_prompt(agent)
      -  "pi" => first_prompt_pi
      +  "pi" | "omp" => first_prompt_pi
      ```

      The id fallback covers the case where OMP reports `agent_session_id` because it has no session file path yet. Files are named `<timestamp>_<session id>.jsonl`.

      ## Evidence

      - **Before:** `first_prompt("omp", …)` → `None`, so OMP panes in `worktree/*` branches were never renamed.
        **After:** `cargo test` passes 45 tests, including three new ones: `omp_path_does_not_require_home`, `omp_session_id_resolves_under_agent_dir`, and `omp_reads_first_user_text_message`, which uses a fixture shaped like a real OMP session (title/session/model_change/custom records before the first user message).
      - `cargo fmt --check` and `cargo clippy --all-targets -- -D warnings` are clean.

      ## Merge Danger

      **Door:** two-way

      **Blast Radius:** OMP panes only. Claude, Codex and Pi code paths are unchanged.
