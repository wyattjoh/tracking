      - With a database, `connected` turns true one reply later, and `connectionTimeout` covers SELECT.
      - An automatic reconnect keeps the selected database, also after `QUIT`. After `close()`, a failure, `RESET`, or a SELECT of another database that was inside MULTI or got no reply, the next connection uses the URL's.
      - URL `/1`, `select(5)`, a drop, a `select(1)` that is rejected because there is no offline queue: the reconnect is on 5. It was on 1.
      - A selected database that the server later refuses ends the client. `connect()` then uses the URL's. If the refusal is `NOPERM`, the client goes on in the URL's database instead, as before, and runs the queued commands there: `onconnect` has to run for script to authenticate.
