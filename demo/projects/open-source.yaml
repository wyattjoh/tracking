    base: ali/redis-connection
    title: "redis: subscriptions survive a reconnect, and a failed subscribe() leaves nothing behind"
    description: |-
      Stacked on #49210.

      ### What does this PR do?

      Subscriptions survive a reconnect, and a failed `subscribe()` leaves nothing behind. Part of #29042. Replaces #48842. Covers the closed #33290.

      | Call or situation | Before | After |
      |---|---|---|
      | Reconnect, or `close()` then `connect()` | listeners go silent | channels are subscribed again, ahead of any other command; `connect()`, `onconnect` and `connected` do not wait |
      | Server refuses a channel while restoring | n/a | a process warning names the channel and the error; the channel stays silent until the next connection |
      | `subscribe([a, b])` or `unsubscribe()`, then another subscription call | it takes a surplus acknowledgement; messages are dropped | each call gets its own |
      | `subscribe()` refused, dropped or closed | listener stays: process hangs, or double delivery later | listener removed |
      | `subscribe([a, null])`, `unsubscribe([a, null])` | throws half way | throws before any change |
      | `unsubscribe()` while `subscribe()` is pending | throws | removes its listener |
      | `psubscribe()`, then a drop | `get()` throws, an error reply fails the connection | an ordinary client again |
      | Number, Buffer or lone surrogate as channel in an array | never delivered | delivered |
      | Buffer that is not UTF-8 in `subscribe([...])` | resolves, never delivered | throws |
      | Subscribing after `HELLO 2` or `RESET` | resolves, delivers nothing, replies shift | connection fails: "Subscriptions need RESP3" |
      | `unsubscribe(ch, listener, extra)` | removes every listener | removes that one |
      | `unsubscribe(ch, undefined)` | throws | same as `unsubscribe(ch)` |

      **What can break**

      - A registered listener is restored, also after a raw `UNSUBSCRIBE`, `RESET`, `QUIT`, `close()` or a `subscribe()` inside `MULTI`, even a discarded one. `get()` then throws.
      - A second client made in `onconnect` with the same listener, the first left open, now delivers twice.
      - After a reconnect, commands that are not pipelined (`AUTH`, `MULTI`, `SUBSCRIBE`, ...) are written once the restore is answered: one round trip later.
      - A server or mock that does not answer the restoring `SUBSCRIBE` leaves later commands unanswered, or has their replies taken for its own. One that drops the connection on it uses up the retries and ends the client. One that sends an error nobody asked for during the restore lets a queued `subscribe()` resolve although it is refused; the connection then fails.
      - A publisher that outruns the listeners starves timers, as before, but sooner after a restore. With 20,000 channels, a 0.2 ms listener and a raw `SUBSCRIBE` in `onconnect`, a 1 s timer fired after 2.3-2.5 s in 1.4.4 (3 of 3 runs, over 12 s in others) and not within 5 s here (3 of 3). Without a reconnect both are equal.
      - The warning: one line for each refused channel and reconnect, also for a program that sends `AUTH` and subscribes in `onconnect`. Like every process warning, it ends a program whose stderr is broken (#37347).
      - `unsubscribe()` throws only on a client that never subscribed. Otherwise it resolves, or rejects when closed: a `try` without `await` misses that. With the server down and `subscribe()` still pending, it waits out the retries.
      - A `subscribe()` that is acknowledged after its listener was removed, with no `UNSUBSCRIBE` sent, resolves 0 and stays in subscriber mode until `unsubscribe()`.
      - A raw `SUBSCRIBE` does not revive the listener of a failed `subscribe()`.
      - Servers or mocks that acknowledge `SUBSCRIBE` with an array fail the connection.
      - A peer that acknowledges fewer names than asked (Redis does not) shifts the replies by one once a later request names a missing one.
      - `send("UNPSUBSCRIBE")`, not a Redis command, is now pipelined.

      **Left out**

      - RESP2 delivery (#29050), and `HELLO 2` on a client that already subscribed.
      - Restoring pattern, shard and raw subscriptions.
      - Retrying a refused channel. Two designs were built and dropped. A redial ended clients that connect today while the server is busy. A SUBSCRIBE on the same connection landed inside `MULTI` and aborted the transaction.
      - Waiting for the restore in `connect()`: a message published right after it can be missed. `await client.ping()` waits.
      - Subscribing inside `MULTI`: with several channels a surplus acknowledgement answers the next request, as before. New: if that request is `unsubscribe()` without arguments, subscriber mode stays on until a second `unsubscribe()`. If it names the channels and the server refuses a pipelined subscription behind it, the replies in flight shift by one, where the connection failed.
      - An `UNSUBSCRIBE` acknowledgement that finds no listener ends subscriber mode although another `UNSUBSCRIBE` is in flight, as before.
      - `subscribeBuffer()`.
      - `onconnect = () => client.subscribe(...)` still adds a listener each time.
      - The throw for a second function in #48842.

      **Performance**

      The first four rows and the size are against #49210, the others against its base, on an earlier commit. Instructions per operation, one run; the allocator's share moves by up to 600.

      | Case | Before | After |
      |---|---|---|
      | pipelined GET | 4,600 | 4,608 |
      | serial SET | 7,954 | 8,002 |
      | message delivery (4 longer runs) | 4,617 | 4,638 (+0.5%) |
      | subscribe + unsubscribe | 18,262 | 20,351 |
      | close + connect | 27,289 | 27,458 |
      | `subscribe()` of 200,000 channels, time in the call | 78-103 ms | 104-169 ms |
      | 40,000 pending `subscribe()` calls on one channel, all refused | 1.5 s | 10.8 s (quadratic) |
      | `connect()` and `ping()` with 100,000 channels to restore | 59 ms (none restored) | 164 ms |
      | binary (CI): linux-x64, darwin-aarch64, windows-x64 | | +24.0, +32.3, +31.5 KB |

      No new `unsafe` or panic site.

      ### How did you verify your code works?

      - All of `test/js/valkey` under ASAN, `bun_valkey` tests, clippy, source lints, type checks for Windows, macOS and FreeBSD.
      - Repros on Redis 7.0.15, a model fuzzer over the client (3.2 million programs), and a comparison with #49210 (60 random scenarios, 132 exit cases, the bytes of every method): only listed changes differ.
      - 32 of the 36 new JS tests on a mock server fail before. Four pin what already works. One more runs on a real server.
      - One test of `test/cli/test/isolation.test.ts` times out on both debug builds. CI only: running on Windows and macOS, the types test.
      - Changed: surplus acknowledgements log "ignored" (two Rust tests); `subscriber_mode_outlasts_the_connection` became rows of `modes`; one `test.todo` is enabled (it passed already).
      - Changed, as in #49178: `valkey-gc.test.ts` "keeps an unreferenced client alive until onclose" wanted 0 of 20 clients left and saw 1 on Linux arm64. It now wants that none has an incoming edge or a root in the heap snapshot, and that at most one is left. Traced in build 142670: no edge, no root, one word in the live `VM::drainMicrotasks` frame holds the address. With that word zeroed, the client is collected.


