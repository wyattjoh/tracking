      - **`cell_fan_out` at width 100k:** U/L looks like a win, but that's mostly because #101809 regresses this cell on this base (L/C 4.2× / 1.37×; see #101809). Against canary, U is 1.45× at 16 threads (very noisy, 0.73–2.78) and 0.98× at 32.

      **Does knowing immutability before locking help inside reader-first (U vs U−)?**
      - Most cells overlap 1 and show no clear difference.
      - **A few were slower with the shortcut in all four pairs:**
        - real cold @32 compile, 1.049 (1.02–1.09);
        - `keyed_reader` change_shift at 16 threads, 1.13 (1.04–1.21);
        - cold @32 wall, 1.073 (1.00–1.17).
      - `cell_fan_out` peak RSS at 16 threads was consistently lower with it (0.94, 0.90–0.97).
      - With n = 4 this doesn't establish a cause, but the shortcut isn't shown to help, and the evidence leans slightly against it.
      - The `cell_fan_out` 100k timing is too noisy to tell (0.91–3.69).
      - U− keeps the bitmap upkeep, so this isolates the early-knowledge shortcut, not the total cost of the bitmap.

      ### History: earlier bases, not re-measured

      | Base | Result |
      |---|---|
      | `ef97226c` (3 alternating pairs) | `bench/large-app-router` cold @32: wall +12.3% (77.83 → 87.43 s), compile +13.0% (49.89 → 56.37 s) |
