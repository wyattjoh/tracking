      <li><a href="https://github.com/anomalyco/opentui/commit/cee1698ad0d3c33fee7bf40bb4ec7273107f733e"><code>cee1698</code></a> native, core, rust: keep table cells at the terminal's width method (<a href="https://github.com/anomalyco/opentui/tree/HEAD/packages/core/issues/2149">#2149</a>)</li>
