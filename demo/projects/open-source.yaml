      | `tls.checkServerIdentity` | ignored, throws as the only option | called before HELLO, also for `duplicate()` |
      | `BUN_FEATURE_FLAG_DISABLE_REDIS_AUTO_PIPELINING` without options | ignored | applied |
      | Unknown scheme error | names 7 schemes | names 10 |

