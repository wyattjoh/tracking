  - number: 101912
    owner: gaearon
    notes: Bottom of the parameter matching stack.
    status: draft
    head: fix/rsc-hash-route-fallthrough
    base: canary
    title: Fix client navigation to a URL served by a less specific route
    labels: [ tests, "type: next" ]
    description: |-
      ## Summary

      Fixes client navigation to a URL that one route rejects and a less specific route serves.

      For example, `app/docs/messages/[slug]` only accepts the slugs from `generateStaticParams` (with `dynamicParams = false`, or `unstable_paramMatching = { slug: 'not-found' }` under Cache Components), and `app/docs/[[...slug]]` sits next to it. `/docs/messages/unknown` is served by the catch-all. Loading that URL directly works. Clicking a `<Link>` to it logs `ERR_TOO_MANY_REDIRECTS` and the router reloads the page.

      The first route removes the router headers (`RSC`, `Next-Router-State-Tree`, `Next-Url` and the prefetch headers) from the request before it rejects it. The next route then checks the `_rsc` search param against a different set of headers and redirects. The redirected request starts at the first route again, so the two routes keep redirecting to each other.

      With this change the headers are put back before the next route handles the request. The `_rsc` check itself is unchanged.

      With `next start`, a request for `/docs/messages/unknown` with `RSC: 1` and `Next-Url: /`:

      - Before: 307 responses alternating between `?_rsc=<hash>` and `?_rsc` until the client gives up.
      - After: one 307, then 200.

      In `next dev` there was a second problem with parameter matching. The rejection was remembered on the request, so the catch-all returned 404 where production returns the page. That is fixed here as well.

      ## Verification

      - The new tests cover both `dynamicParams = false` and `unstable_paramMatching`. Before the change they fail with five redirects and with page state lost on navigation. After it they pass in production with Turbopack and Webpack, and in development.
      - These existing suites pass in production with Turbopack: `param-matching-routing`, `segment-cache-closed-params`, `segment-cache-dynamic-params`, `rsc-query-routing`, `rsc-redirect`, `segment-cache/cdn-cache-busting`, `interception-dynamic-segment`.
      - Deployed to Vercel with the adapter and with the default builder: the new tests pass. A deployment has no `_rsc` redirect, so the tests check the final status and not the number of redirects.

      <!-- NEXT_JS_LLM -->
  - number: 101913
    owner: gaearon
    status: draft
    head: fix/param-matching-blocking-prefetch
    base: fix/rsc-hash-route-fallthrough
    title: Keep prefetch data for blocking parameters
    labels: [ tests, "type: next" ]
    description: |-
      ## Summary

      Keeps the prefetch data for a parameter that is explicitly `blocking`.

      Take `app/[lang]/catalog/[top]/items/[bottom]/page.tsx` with `top: 'blocking'` and one page generated at build. Without `unstable_paramMatching`, the build also renders the route with `top` unknown and writes its segment files. A deployment serves those files when a link to a `top` that was not generated is prefetched.

      Adding `top: 'blocking'` skipped that render whenever a more specific page existed, so the segment files were missing. Routes with `ensureStatic = 'navigation'` were not affected, because that mode already keeps the render.

      Route tree prefetch for `/en/catalog/<new top>/items/<new bottom>` on Vercel, same fixture:

      | | Before | After |
      | --- | --- | --- |
      | Adapter | 4,460 bytes, the full RSC payload from the function | 458 bytes, from `[bottom].segments/_tree.segment.rsc` |
      | Default builder | 404 | 458 bytes, from `[bottom].segments/_tree.segment.rsc` |

      With `next start` the response was already correct, because the server builds it on request. The difference only shows on a deployment, where a missing file means the request goes somewhere else.

      This does not change how a document request for a new value is answered. `blocking` still generates the page before responding, and the generic render is still not served as a fallback.

      ## Verification

      - New tests: the route tree prefetch below a `blocking` parameter does not contain the page payload, and the build emits `_tree.segment.rsc` for that level. The second one fails without the change.
      - Deployed the `param-matching-routing` fixture to Vercel from this branch. With the adapter the suite passes. With the default builder one test still fails, which is unrelated to this change: that builder stores one entry per value of a `dynamic` parameter. Before this change four tests failed there.
      - Twelve existing parameter matching suites pass in production with Turbopack, including `generate-prerender-matching`, `param-matching-runtime`, `param-matching-ensure-static` and `param-matching-unseeded-prefix`.

      <!-- NEXT_JS_LLM -->
  - number: 101914
    owner: gaearon
    status: draft
    head: fix/param-matching-empty-static-params
    base: fix/param-matching-blocking-prefetch
    title: Allow an empty generateStaticParams result with explicit parameter matching
    labels: [ tests, "type: next" ]
    description: |-
      ## Summary

      Lets `generateStaticParams` return an empty array when the route says what happens to values that were not generated.

      Under Cache Components an empty result fails the build:

      > When using Cache Components, all `generateStaticParams` functions must return at least one result.

      A route with `unstable_paramMatching = { slug: 'blocking' }` already builds if it has no `generateStaticParams` at all. It failed only when the function existed and returned `[]`. That happens in practice when the list comes from an API and is empty in some environments.

      Now an empty result is accepted when every parameter it leaves without a value is explicitly `blocking`, `fallback` or `dynamic`.

      The error stays in two cases:

      - The parameter is `not-found`. With no values the route would match nothing.
      - The parameter has no matching mode. Its behavior would be inferred without a build-time example, which is what the error protects against.

      Routes without `unstable_paramMatching` are not affected.

      ## Verification

      - New tests build a route for each of `blocking`, `fallback` and `dynamic` with an empty `generateStaticParams`, check that the `blocking` one serves a new value, and check that a `not-found` parameter and a parameter without a mode still fail with the existing message.
      - The existing `empty-generate-static-params` suite and the static paths unit tests pass.

      <!-- NEXT_JS_LLM -->
  - number: 101915
    owner: gaearon
    status: draft
    head: test/param-matching-revalidation
    base: fix/param-matching-empty-static-params
    title: Add revalidation tests for parameter matching
    labels: [ tests ]
    description: |-
      ## Summary

      Adds tests for cache invalidation on routes that use `unstable_paramMatching`.

      The existing tests only call `revalidatePath`. This suite covers `revalidateTag`, `updateTag` from a Server Action, and expiry through `cacheLife`. It runs them against `not-found`, `blocking`, `fallback` and `dynamic` parameters, for a value generated at build and for one generated at runtime, and against a route without matching configuration for comparison.

      It checks that:

      - Invalidating one value's tag regenerates that value and leaves other values alone.
      - Invalidating a tag shared by the route regenerates every value.
      - A closed route still returns 404 for a value that was not generated, before and after invalidation.
      - Values of a `dynamic` parameter share one entry, and it regenerates for all of them together.
      - A cached value with a short `cacheLife` is replaced after it expires.

      There are no framework changes in this PR.

      Running the suite on Vercel showed three things that the tests now state explicitly:

      - A route that serves a shell for a value that was not generated at build is not always stored afterwards. This applies to `fallback` and to routes without matching configuration. The adapter stored the page after the first request with the fixture's own config. The default builder rendered it on every request, and so did the adapter under the Cache Components deploy job's configuration. Those cases run with `next start` only.
      - The default builder stores one entry per value of a `dynamic` parameter below a `blocking` one. The adapter stores one entry. That case is skipped on the default builder.
      - After `updateTag`, a deployment can return the old value once more after it has already returned the new one. This also happens on the route without matching configuration. On a deployment the test retries; with `next start` it requires the first read to be fresh.

      ## Verification

      - `next start` with Turbopack: 46 passed.
      - Deployed with the adapter: 22 passed, 24 skipped.
      - Deployed with the adapter under the Cache Components deploy job's configuration: 22 passed, 24 skipped.
      - Deployed with the default builder: 20 passed, 26 skipped.
      - Not run: Webpack.

      <!-- NEXT_JS_LLM -->
  - number: 101809
    owner: sokra
    notes: Approved; waiting on the reader change above it.
    status: draft
    head: fleet/turbo-tasks-known-immutable-bitmap
    base: canary
    title: "turbo-tasks-backend: track known-immutable tasks to skip speculative owner locks"
    labels: [ "created-by: Turbopack team", Turbopack ]
    description: |-
      ## Summary

      Stacked below #101797. It splits out the known-immutable bitmap so it can be reviewed and measured on its own against canary.

      ### What

      A lock-free, per-backend bitmap (`backend/known_immutable.rs`) of task ids known to be immutable, used on canary's existing lock paths:

      - **Reads** (`lock_task_and_optional_reader`, shared by `try_read_task_cell` and `try_read_task_output`):
        - **Hit:** lock only the task, re-check `immutable()` under its guard, and return no reader guard.
        - **Miss:** lock the task and the reader together right away with a new `ExecuteContext::try_task_pair`. Before, the task was locked alone first to check its flag, then dropped and re-locked as a pair. If the task turns out to be immutable under the pair lock, its bit is set and the reader guard is dropped. Mutable tasks are still read and registered under both locks, so invalidation is unchanged.
      - **Keyed refinement** (`refine_provisional_cell_dependency`) of a known-immutable task: the task and the reader are locked one after the other instead of as a pair. Only the provisional edge is removed, and no hash edges are added. The miss path is unchanged.
      - **Maintenance:** the bit is set
        - when a task becomes immutable on completion (under the task lock);
        - when task data with the immutable flag is restored;
        - whenever a read or refinement finds a task immutable.

      `try_task_pair(task, reader)`:
      - opens `task` with `AllowMissing` and `reader` with `MustExist`, restoring both like `task_pair`;
      - returns `None` for a task that is missing, missing on disk, only partially restorable, or soft-deleted, and leaves no fabricated entry or lock count behind, matching `try_task`. So a read of a collected task still fails with the same error;
      - is shared with `task_pair` through one `open_task_pair` loop, so `task_pair` callers are unchanged.

      **Invariants** the bitmap relies on (documented in the module):
      - `immutable` only ever goes from `false` to `true`, and survives eviction and restore;
      - task ids aren't reused (`IdFactoryWithReuse::reuse` has no callers; GC doesn't recycle ids);
      - transient and persistent ids don't overlap, and each backend has its own bitmap.

      A miss is always safe, because the normal path re-checks the flag under the lock. `contains` always returns `false` under `verify_immutable`.

      ### Why: does knowing immutability before locking help?

      Measured on canary [`28c81278`](https://github.com/vercel/next.js/commit/28c812788db80d6cf9300f88e4df19107bc66fb4), which includes the delayed collectible propagation (#101748) and the keyed-dependency early exit (#101736). Release native bindings and bench binaries were built separately for each arm, and all eight artifacts were checked to differ by sha256.

      | Arm | Build |
      |---|---|
      | C | canary |
      | L | this PR |
      | U | this PR + #101797 |
      | U− | U with `KnownImmutable::contains` forced to `false`, bitmap upkeep kept (measurement-only control, not committed) |

      **Answer on canary alone (L vs C):**
      - **Per-key `get` micro-benchmark:** a clear win (0.51–0.84× in the four phases that do real work: initial, change_one, change_shift, change_all). The likely reason is that mutable reads skip the speculative owner lock. The sub-millisecond `change_none` and ~150 ms `change_unread` phases are within noise (e.g. `change_none` at 16 threads is 1.53×, 0.4 → 0.6 ms).
      - **`keyed_reader`:** neutral to slightly faster in the same four phases (0.92–1.03×). `change_unread` at 32 threads is 1.10× (0.98–1.26).
      - **Real builds:** neutral. Compile is 0.98× cold and 1.01× warm, with overlapping ranges.
      - **⚠️ `cell_fan_out` at width 100k regresses:** 4.20× at 16 threads and 1.37× at 32, slower in all four pairs. Widths 1k and 10k are neutral. This is new on this base (on `8d1f4ed9` it was 0.90–1.02×). A separate alternating rerun (3 pairs, 16 threads) confirmed it: L took 5.34–5.58 s per iteration vs C's 1.71–3.48 s. **I haven't established the cause.** In this benchmark, 100k mutable dependents of one cell re-read it after an invalidation. This PR takes a single pair lock section there, where canary takes a probe followed by a pair. Contention on that pair lock is a hypothesis, not a measured cause. The interaction with canary changes since `8d1f4ed9` isn't bisected either.

      **Answer within the reader-first protocol (U vs U−):** see #101797. In brief: most cells show no clear difference, but a few are consistently slower with the shortcut, e.g. real cold @32 compile at 1.05× (1.02–1.09).

      #### Real builds: `bench/large-app-router`, L vs C

      n = 4 per arm per cell, in a balanced 4×4 Williams square (each arm once in each position). All 48 builds exited 0. Values are mean [min–max]; the ratio is the mean of per-rep paired ratios.

      | Cell | Metric | C | L | L/C (paired range) |
      |---|---|---|---|---:|
      | cold @32 | wall (s) | 72.5 [69.9–76.9] | 69.5 [65.3–76.0] | 0.959 (0.91–0.99) |
      | cold @32 | compile (s) | 43.6 [42.4–45.8] | 42.6 [40.7–47.1] | 0.976 (0.95–1.03) |
      | cold @32 | main VmHWM (GiB) | 12.25 [12.23–12.26] | 12.26 [12.11–12.35] | 1.001 |
      | cold @32 | tree peak RSS (GiB) | 20.09 [16.05–24.50] | 15.99 [15.91–16.05] | 0.829 (0.65–1.00) |
      | cold @16 | wall (s) | 88.6 [84.7–93.3] | 86.6 [81.9–90.0] | 0.978 (0.94–1.03) |
      | cold @16 | compile (s) | 58.9 [57.0–60.6] | 57.9 [55.2–60.7] | 0.983 (0.94–1.02) |
      | cold @16 | main VmHWM (GiB) | 11.92 [11.80–12.04] | 11.90 [11.85–12.02] | 0.998 |
      | cold @16 | tree peak RSS (GiB) | 16.27 [16.12–16.48] | 16.36 [16.25–16.47] | 1.005 |
      | warm @32 | wall (s) | 32.6 [30.5–34.3] | 32.0 [30.1–33.6] | 0.985 (0.88–1.08) |
      | warm @32 | compile (s) | 5.4 [5.2–5.7] | 5.5 [5.1–5.7] | 1.012 (0.89–1.06) |
      | warm @32 | main VmHWM (GiB) | 5.27 [5.26–5.28] | 5.27 [5.26–5.29] | 1.001 |
      | warm @32 | tree peak RSS (GiB) | 15.87 [15.59–16.03] | 15.77 [15.53–15.97] | 0.994 |

      - **Memory gate:** a cell fails if the mean ratio is > 1.01 **and** the ranges are disjoint. It passes in every cell for both main VmHWM and tree peak RSS.
      - **Tree-peak outliers:** two of the four **canary** cold @32 runs reached 23.74 and 24.50 GiB, against ~16 GiB for the others. So the ~24 GiB tree-peak spikes seen in earlier rounds aren't unique to this stack; their cause is unknown. The 0.83× L/C tree peak reflects those canary spikes; it isn't a memory improvement.

      #### Micro-benchmarks, L vs C

      n = 4, the same Williams square per cell. All 96 runs exited 0, and the benchmarks' own correctness assertions passed.

      `keyed_deps` (`KEYED_DEPS_PROFILE=1`, n = 1000 readers, m = 10000 keys, shared), mean ms, L/C paired:

      | Mode | Phase | 16 threads | 32 threads |
      |---|---|---:|---:|
      | per-key `get` | initial | 8314 → 6047 (0.731) | 10207 → 5189 (0.512) |
      | per-key `get` | change_one | 6335 → 4838 (0.761) | 8043 → 5910 (0.739) |
      | per-key `get` | change_shift | 14608 → 11939 (0.817) | 15700 → 13114 (0.839) |
      | per-key `get` | change_all | 6904 → 4939 (0.717) | 8434 → 6117 (0.727) |
      | `keyed_reader` | initial | 457 → 452 (0.988) | 452 → 463 (1.026) |
      | `keyed_reader` | change_one | 480 → 441 (0.918) | 519 → 496 (0.958) |
      | `keyed_reader` | change_shift | 3859 → 3683 (0.964) | 4078 → 3914 (0.968) |
      | `keyed_reader` | change_all | 663 → 637 (0.962) | 703 → 682 (0.975) |

      `cell_fan_out` (criterion point estimate per iteration, mean over reps; L/C paired):

      | Width | 16 threads | 32 threads |
      |---|---:|---:|
      | 1k | 4.57 → 4.61 ms (1.006) | 5.19 → 5.34 ms (1.034) |
      | 10k | 57.1 → 58.6 ms (1.027) | 68.7 → 62.7 ms (0.912) |
      | **100k** | **1171 → 4835 ms (4.199, 3.35–4.65)** | **3572 → 4893 ms (1.368, 1.30–1.44)** |

      - **Peak RSS:** keyed_deps L/C is 0.99–1.01, and `cell_fan_out` L/C is 1.00.

      #### Output sanity

      Fresh outputs from the four C and four L cold @32 builds, compared after the existing field-level normalization (build id, app path, per-build keys, Flight row-id relabeling): all eight canonical manifests are identical (211,210 files each). This is a check on this fixture only, not a general proof that outputs are equivalent.

      #### History

      On canary `8d1f4ed9` (before #101736 and #101748), the same method gave:
      - L/C real-build compile of +4–7% (cold @32 slower in all four pairs);
      - the same per-key `get` wins;
      - neutral `keyed_reader` and `cell_fan_out`.

      The compile slowdown doesn't reproduce on `28c81278`. The `cell_fan_out` 100k regression is new on it.

      ## Verification

      Rerun after rebasing onto canary `28c81278`. The rebase had no conflicts; each commit compiles on its own (`cargo check --all-targets`).

      **Tests in this PR:**
      - **`tests/known_immutable.rs` integration tests**, through the public API:
        - an immutable task is known-immutable and its cell and output readers stay correct;
        - cell-only and output-only readers of a mutable task are each invalidated;
        - keyed `get` and `keyed_reader` reads of an immutable keyed cell add no hashed dependents;
        - an immutable task collected by GC and called again re-executes under a **new** id, while cell and output reads of the old id fail even though its bit stays set.
      - **Lock-level unit tests next to `try_task_pair`** in `operation/mod.rs`, for what the public API can't observe:
        - a bitmap hit never opens the reader;
        - a stale bit for a missing or soft-deleted task returns `None` and leaves no entry or pins behind;
        - plus the `try_task_pair` and bitmap unit tests.

      **Commands:**
      - `cargo test -p turbo-tasks-backend -p turbo-tasks -p auto-hash-map` (debug) passes.
      - `cargo test -p turbo-tasks-backend --release`: the only failure is `test_eventual_read_in_top_level_task_fails`, which fails the same way on canary `28c81278`.
      - `cargo test -p turbo-tasks-backend --features verify_immutable --lib --test immutable_shortcut_restore --test known_immutable` passes; only the optimization-only checks are ignored.
      - 20 release repetitions of `--lib`, `known_immutable`, `immutable_shortcut_restore`, `keyed_dependencies`, `keyed_many_changed_keys`, `collectibles_read_race`, `collectibles_pending_restart` and `invalidation`: 0 failures.
      - `cargo clippy --all-targets -- -D warnings` (backend, `turbo-tasks`, `auto-hash-map`) and rustfmt are clean.

      **Mutation checks** (from the previous round; the code is unchanged):
      - Bypassing the bitmap-hit branch fails the "never opens the reader" test.
      - Always dropping the reader guard on the miss path fails both the cell-only and the output-only invalidation tests.
      - Removing the soft-deleted check in `try_task_pair` fails `try_task_pair_deleted_task_is_none`.

      <!-- NEXT_JS_LLM -->


