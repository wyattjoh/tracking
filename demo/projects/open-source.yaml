    description: |-
      A box drew one border style and one color on all four sides. A double top line over a single frame, or one colored
      edge, needed nested boxes, and nested boxes cannot share a corner cell. nwidynski raised this while compiling CSS
      to OpenTUI properties, where `border-top-style` and `border-top-color` had no one-box equivalent.

      Native boxes now take per-side overrides through `ot_scene_set_box_sides`, and Rust's `View` gets
      `border_style_for` and `border_color_for`. A side without an override keeps the box's style and color. Where unlike
      styles meet, the corner uses Unicode's mixed single/double or light/heavy glyph, otherwise the top or bottom
      side's, in that side's color. Custom glyphs and the focus color still win. Existing calls, records and Rust struct
      literals are unchanged; Zig code that reads a scene node's box details through `Context.raw()` now reads
      `control.box.details`. Core's Box props follow separately.

      Boxes without overrides cost no more than on main: eight measured frames of 154 boxes (all, one or no borders,
      translucent, titled) use as many instructions or fewer, and node, details, app and view sizes and their heap bytes
      match. A box with overrides allocates 56 bytes.

      Native tables cover every style pair at each corner, sides off, colors, focus and a translucent side; Rust tests
      drive `View`.

