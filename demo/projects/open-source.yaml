      ### [`v8.4.1`](https://redirect.github.com/pillarjs/path-to-regexp/releases/tag/v8.4.1)

      [Compare Source](https://redirect.github.com/pillarjs/path-to-regexp/compare/v8.4.0...v8.4.1)

      **Fixed**

      - Remove trie deduplication ([#&#8203;431](https://redirect.github.com/pillarjs/path-to-regexp/issues/431))  [`6bc8e84`](https://redirect.github.com/pillarjs/path-to-regexp/commit/6bc8e84)
        - Using a trie required non-greedy matching, which regressed wildcards in non-ending mode by matching them up until the first match. For example:
          - `/*foo` with `/a/b` = `/a`
          - `/*foo.html`with `/a/b.html/c.html` = `/a/b.html`
      - Allow backtrack handling to match itself ([#&#8203;427](https://redirect.github.com/pillarjs/path-to-regexp/issues/427))  [`5bcd30b`](https://redirect.github.com/pillarjs/path-to-regexp/commit/5bcd30b)
        - When backtracking was introduced, it rejected matching things like `/:"a"_:"b"` against `/foo__`. This makes intuitive sense because the second parameter is not going to backtrack on `_` anymore, but it's somewhat unexpected since there's no reason it shouldn't match the second `_`.

