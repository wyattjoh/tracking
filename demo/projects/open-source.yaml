      - Clippy (`--all-targets -D warnings`) and rustfmt are clean.

      **Tests in this PR:**
      - **Exhaustive protocol checker:** covers one and two same-edge reads, re-execution and post-completion writes. It catches both negative controls: owner-first ordering, and skipping the owner insert on "already current".
      - **Deterministic interleaving tests** on the real backend: writer between/after the steps, outdated edges, concurrent same-edge reads, TrackOnlyError retry, missing/in-progress/recompute paths, `final_read_hint`, immutable rollback, and refinement with/without keys, refused, and with an immutable owner.
      - **Stress:** 16 and 32 actual Tokio worker threads with GC and eviction.

