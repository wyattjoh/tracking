    description: |-
      **Do not merge yet.** The states are being modelled again, in a PR without behaviour changes that goes under this one.

      ### What does this PR do?

      `--redis-preconnect` called `connect()` and dropped the promise, so a failure killed the program with a rejection that it could not catch. It now behaves like `--fetch-preconnect`: one quiet attempt that does not hold the process, and the first use dials again.

      - `State` is `Idle`, `Active { phase, purpose }` or `Closed`, and `Purpose` is `Preconnect` or `Asked { retries }`. The field `retries` is gone from `Client`.
      - The fix itself: `preconnect()`, `claim()` and the first arm of `lost()`. The rest of the diff of `client.rs` follows the new shape.
      - A command, `connect()`, `close()` or setting `onconnect` or `onclose` to a function claims the client. From then on it behaves as without the flag.
      - No panic site or `unsafe` added. `lost()` still has an arm for `Idle` and `Closed`, where it cannot be called.

      | server, program | `--fetch-preconnect` | `--sql-preconnect` | Redis before | Redis now |
      | --- | --- | --- | --- | --- |
      | down, client unused | exits at once | exits at once | exits 1 after 31 s | exits at once |
      | silent, client unused | exits at once | waits for its timeout | exits 1 after 10 s | exits at once |
      | comes up later, client unused | no second dial | no second dial | dials again | no second dial |
      | comes up later, then the first use | dials | dials | uses the retry, or waits up to 2 s for it | dials |

      **What can break** (only with the flag, and only after the attempt failed or the unused connection dropped)

      - **A program that only polls `connected`, or sets a handler after the failure, is not connected until it sends a command or calls `connect()`.**
      - Nothing is printed, and there is no `unhandledRejection`. A wrong password shows at the first command.
      - `close()` does nothing then, so a later command dials.

      **Performance**, instructions, with the PRs stacked on it, on the previous commit: GET -1.7%, SET -0.8%, message -2.0%.

      ### How did you verify your code works?

      - Linux x64, debug + ASAN, on this branch alone: nine files of `test/js/valkey`, 37 Rust tests and clippy pass. "should handle connection timeout" needs a network that drops packets.
      - Without the flag: 4.8 million random programs match the state machine before, and 550 runs match main. With it: 650 runs without an unsettled promise, a second `onclose` or an ASAN report.
      - Six mutants of the new transitions fail a Rust test. No existing assertion changed.
      - CI only: macOS, Windows, `--trim`.


