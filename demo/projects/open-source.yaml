    description: |-
      Bumps the dependencies group with 4 updates: [@opentui/core](https://github.com/anomalyco/opentui/tree/HEAD/packages/core), [@opentui/react](https://github.com/anomalyco/opentui/tree/HEAD/packages/react), [react](https://github.com/react/react/tree/HEAD/packages/react) and [@types/bun](https://github.com/DefinitelyTyped/DefinitelyTyped/tree/HEAD/types/bun).

      Updates `@opentui/core` from 0.5.14 to 0.9.2
      <details>
      <summary>Release notes</summary>
      <p><em>Sourced from <a href="https://github.com/anomalyco/opentui/releases">@​opentui/core's releases</a>.</em></p>
      <blockquote>
      <h2>Release v0.9.2</h2>
      <h2>Fixed</h2>
      <ul>
      <li><strong>native:</strong> If the native library is missing outside an OpenTUI checkout, the <code>opentui-sys</code> build script names the release archive to extract, such as <code>opentui-native-v0.9.2-linux-x64.zip</code>, instead of <code>bun run build</code>. Set <code>OPENTUI_LIB_HINT</code> to replace this advice with your own setup step. See <a href="https://opentui.com/docs/bindings/rust">Rust</a>. (<a href="https://redirect.github.com/anomalyco/opentui/pull/2150">#2150</a>)</li>
      </ul>
      <p>API changes and documentation: <a href="https://opentui.com/docs/releases/0.9.2">https://opentui.com/docs/releases/0.9.2</a></p>
      <h2>What's Changed</h2>
      <ul>
      <li>rust: give git consumers usable advice for a missing native library by <a href="https://github.com/simonklee"><code>@​simonklee</code></a> in <a href="https://redirect.github.com/anomalyco/opentui/pull/2150">anomalyco/opentui#2150</a></li>
      </ul>
      <p><strong>Full Changelog</strong>: <a href="https://github.com/anomalyco/opentui/compare/v0.9.1...v0.9.2">https://github.com/anomalyco/opentui/compare/v0.9.1...v0.9.2</a></p>
      <h2>Release v0.9.1</h2>
      <p><code>createCliRenderer()</code> returns before the terminal answers its startup queries, and an answer can change the width method. Up to 0.9.0, text created before that answer kept the startup guess. In tmux inside GNU Screen over ssh, a textarea put its cursor at cell 4 after <code>👍🏽</code> while the terminal drew the emoji in 2 cells, and selections and colors could land on other text.</p>
      <p>In 0.9.1, a renderer whose width method changes measures the text in its scene again: Text, Code, Input, Textarea, <code>TextTable</code>, and Markdown tables. Cursors, selections, marks, colors, and undo points stay on their text. Applications that use these renderables need no changes.</p>
      <p>A <code>TextBuffer</code> or <code>EditBuffer</code> that you create yourself keeps its width method. Pass <code>true</code> as the new third argument of <code>create()</code> to make it follow the renderer that shows it. Only one renderer at a time can show such a buffer. For a buffer that you draw outside a scene, call <code>setWidthMethod()</code> when the capabilities change:</p>
      <pre lang="typescript"><code>import { CliRenderEvents, TextBuffer, createCliRenderer } from &quot;@opentui/core&quot;
      <p>const renderer = await createCliRenderer()<br />
      const widthMethod = renderer.capabilities?.unicode ?? &quot;unicode&quot;</p>
      <p>const shown = TextBuffer.create(widthMethod, renderer.nativeScene, true)</p>
      <p>const offscreen = TextBuffer.create(widthMethod, renderer.nativeScene)<br />
      renderer.on(CliRenderEvents.CAPABILITIES, (capabilities) =&gt; {<br />
      if (capabilities) offscreen.setWidthMethod(capabilities.unicode)<br />
      })<br />
      </code></pre></p>
      <h2>Breaking changes</h2>
      <ul>
      <li><strong>native:</strong> The <code>reserved</code> field of <code>ot_edit_buffer_options</code> is now <code>flags</code>. C code that names the field must rename it; code that zeroes the struct compiles unchanged. See <a href="https://opentui.com/docs/native/c">C</a>. (<a href="https://redirect.github.com/anomalyco/opentui/pull/2148">#2148</a>)</li>
      </ul>
      <h2>Added</h2>
      <ul>
      <li><strong>core:</strong> <code>TextBuffer.create()</code> and <code>EditBuffer.create()</code> take an optional <code>followSessionWidth</code> argument. A second renderer that shows a following buffer throws a <code>NativeError</code> with <code>NativeStatus.WrongSession</code>. See <a href="https://opentui.com/docs/extend/editing">Editing buffers and views</a>. (<a href="https://redirect.github.com/anomalyco/opentui/pull/2148">#2148</a>)</li>
      <li><strong>core:</strong> <code>TextBuffer.setWidthMethod()</code> changes the width method of a buffer that you draw outside a scene, and <code>TextBufferView.setSelectionColors()</code> recolors the current selection without moving it. See <a href="https://opentui.com/docs/extend/editing">Editing buffers and views</a>. (<a href="https://redirect.github.com/anomalyco/opentui/pull/2148">#2148</a>, <a href="https://redirect.github.com/anomalyco/opentui/pull/2149">#2149</a>)</li>
      <li><strong>native:</strong> The C side of the same features: the <code>OT_EDIT_BUFFER_FOLLOW_SESSION_WIDTH</code> flag, <code>ot_text_buffer_set_width_method</code>, and the <code>OT_SCENE_TEXT_SELECTION_COLORS</code> operation. See <a href="https://opentui.com/docs/native/c">C</a>. (<a href="https://redirect.github.com/anomalyco/opentui/pull/2148">#2148</a>, <a href="https://redirect.github.com/anomalyco/opentui/pull/2149">#2149</a>)</li>
      <li><strong>native:</strong> <code>link.exe</code> can link <code>opentui-static.lib</code> into Windows MSVC executables, which also need <code>ntdll</code>, <code>user32</code>, <code>bcrypt</code>, and <code>legacy_stdio_definitions</code>. See <a href="https://opentui.com/docs/native/c">C</a>. (<a href="https://redirect.github.com/anomalyco/opentui/pull/2140">#2140</a>)</li>
      </ul>
      <h2>Changed</h2>
      <ul>
      <li><strong>native:</strong> The release archives and npm packages also ship <code>LICENSE-ZIG</code>, <code>LICENSE-LLVM</code>, <code>LICENSE-MINGW-W64</code>, <code>LICENSE-GDTOA</code>, and <code>LICENSE-YOGA</code>. See <a href="https://opentui.com/docs/native/c">C</a>. (<a href="https://redirect.github.com/anomalyco/opentui/pull/2140">#2140</a>)</li>
      </ul>
      <!-- raw HTML omitted -->
      </blockquote>
