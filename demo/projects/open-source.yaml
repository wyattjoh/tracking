  - number: 101797
    owner: sokra
    status: draft
    head: turbo-tasks-reader-first-cell-deps
    base: fleet/turbo-tasks-known-immutable-bitmap
    title: "turbo-tasks-backend: register cell dependencies reader first"
    labels: [ "created-by: Turbopack team", Turbopack ]
    description: |-
      ## Summary

      **Stacked on #101809** (the known-immutable bitmap, split out as requested). This draft is published for discussion. **It isn't ready to merge:** against current canary, it regresses keyed_deps `keyed_reader` by 3.3–4.7× (initial, change_one and now also change_all) and per-key `get` change_one / change_all by 1.5–1.6×. It also raises their peak RSS by 13–19%.

      **Stack:** `canary` ← #101809 (known-immutable bitmap, `try_task_pair`) ← this PR (reader-first cell dependency registration).

      ### Results on the current stack

      Measured on canary [`28c81278`](https://github.com/vercel/next.js/commit/28c812788db80d6cf9300f88e4df19107bc66fb4), which includes the delayed collectible propagation (#101748) and the keyed-dependency early exit (#101736). Release native bindings and bench binaries were built separately for each arm, and all eight artifacts were checked to differ by sha256:

      | Arm | Build |
      |---|---|
      | C | canary |
      | L | #101809 |
      | U | this PR on top of #101809 |
      | U− | U with `KnownImmutable::contains` forced to `false`, bitmap upkeep kept (measurement-only control, not committed) |

      **Real builds** (`bench/large-app-router`): n = 4 per arm per cell, in a balanced 4×4 Williams square; all 48 builds exited 0. Values are mean [min–max], with paired per-rep ratios.

      | Cell | Metric | C | U | **U/C** | U/L | U/U− |
      |---|---|---|---|---:|---:|---:|
      | cold @32 | wall (s) | 72.5 [69.9–76.9] | 72.6 [66.0–80.7] | 1.001 (0.94–1.13) | 1.048 (0.95–1.24) | 1.073 (1.00–1.17) |
      | cold @32 | compile (s) | 43.6 [42.4–45.8] | 42.9 [39.1–45.6] | 0.984 (0.92–1.06) | 1.010 (0.91–1.12) | **1.049 (1.02–1.09)** |
      | cold @32 | main VmHWM (GiB) | 12.25 | 12.29 | 1.004 | 1.002 | 0.989 |
      | cold @32 | tree peak RSS (GiB) | 20.09 [16.05–24.50] | 18.21 [15.88–24.88] | 0.919 (0.68–1.02) | 1.139 (0.99–1.56) | 1.128 (0.98–1.54) |
      | cold @16 | wall (s) | 88.6 [84.7–93.3] | 84.4 [81.1–90.0] | 0.952 (0.94–0.96) | 0.974 (0.93–1.01) | 1.011 |
      | cold @16 | compile (s) | 58.9 [57.0–60.6] | 57.0 [55.3–60.4] | 0.967 (0.95–1.00) | 0.985 (0.92–1.02) | 1.018 |
      | cold @16 | main VmHWM (GiB) | 11.92 | 11.98 | 1.005 | 1.007 | 0.998 |
      | cold @16 | tree peak RSS (GiB) | 16.27 | 16.51 | 1.014 | 1.009 | 1.003 |
      | warm @32 | wall (s) | 32.6 [30.5–34.3] | 32.6 [30.3–35.1] | 1.004 (0.91–1.12) | 1.021 (0.92–1.13) | 1.042 |
      | warm @32 | compile (s) | 5.4 [5.2–5.7] | 5.5 [5.0–5.9] | 1.016 (0.92–1.15) | 1.005 (0.87–1.08) | 1.007 |
      | warm @32 | tree peak RSS (GiB) | 15.87 | 15.78 | 0.994 | 1.001 | 0.997 |

      (L values are in #101809.)

      - **Timing vs canary:** U/C compile is 0.97–1.02 across cells. Cold @16 was faster than canary in all four pairs (compile 0.95–1.00, wall 0.94–0.96); the other cells' ranges straddle 1.
      - **Tree-peak outliers:** one U cold @32 run reached **24.88 GiB**, against ~16 GiB for the others. Two of the four **canary** runs in the same cell did the same (23.74 and 24.50 GiB). So these spikes aren't unique to this stack, but their cause is unknown. This doesn't show that the stack doesn't contribute, or that the earlier 25.35 / 24.00 GiB outliers had the same cause, so **memory neutrality isn't established.**

      **Micro-benchmarks:** n = 4, the same Williams square per cell; all 96 runs exited 0, and the benchmarks' correctness assertions passed. Paired ratios at 16 / 32 threads:

      | Benchmark | Phase | **U/C** | U/L | U/U− |
      |---|---|---:|---:|---:|
      | keyed_deps `keyed_reader` | initial | **3.27 / 3.54** | 3.33 / 3.46 | 1.03 / 1.08 |
      | keyed_deps `keyed_reader` | change_one | **4.71 / 4.07** | 5.13 / 4.26 | 1.13 / 0.97 |
      | keyed_deps `keyed_reader` | change_shift | 0.88 / 0.77 | 0.91 / 0.80 | **1.13 (1.04–1.21)** / 1.00 |
      | keyed_deps `keyed_reader` | change_all | **4.44 / 4.16** | 4.61 / 4.28 | 1.00 / 1.02 |
      | keyed_deps per-key `get` | initial | 1.12 / 0.91 | 1.54 / 1.77 | 1.02 / 0.99 |
      | keyed_deps per-key `get` | change_one | 1.59 / 1.45 | 2.10 / 1.96 | 1.06 / 1.01 |
      | keyed_deps per-key `get` | change_shift | 0.89 / 0.93 | 1.09 / 1.11 | 1.06 / 1.01 |
      | keyed_deps per-key `get` | change_all | 1.56 / 1.48 | 2.18 / 2.03 | 0.98 / 1.01 |
